# Paper-trading stack. Ports bind to 127.0.0.1 only: reach the dashboard via
# a VPN or SSH tunnel, never a public port (docs/security.md §3).
#
#   cp backend/.env.example backend/.env   # fill in keys
#   POSTGRES_PASSWORD=... docker compose -f infra/docker-compose.yml up -d --build

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: algotrade
      POSTGRES_USER: algotrade
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algotrade"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ../backend
    env_file: ../backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://algotrade:${POSTGRES_PASSWORD}@postgres:5432/algotrade
      API_HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  # Independent process: shares only the database with the API.
  watchdog:
    build: ../backend
    command: ["algotrade-watchdog"]
    env_file: ../backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://algotrade:${POSTGRES_PASSWORD}@postgres:5432/algotrade
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on: [api]
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
